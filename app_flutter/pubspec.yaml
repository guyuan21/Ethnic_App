name: app_flutter
description: Local cartoon ethnic culture recognition app
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_tts: ^4.0.2
  google_mlkit_text_recognition: ^0.16.0
  http: ^1.2.2
  image_picker: ^1.1.2
  image: ^4.9.1
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^7.1.1
  sherpa_onnx: ^1.13.4
  shared_preferences: ^2.3.3
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/culture_info.json
    - assets/costume_reference.json
    - assets/model/
    - assets/asr/sensevoice/
    - assets/costumes/
    - assets/totems/
